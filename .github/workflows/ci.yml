name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  contracts:
    name: Foundry build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check for contracts
        id: check
        run: |
          if [ -d contracts ] && [ -f contracts/foundry.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: foundry-rs/foundry-toolchain@v1
        if: steps.check.outputs.present == 'true'
        with:
          version: stable
      - name: forge build
        if: steps.check.outputs.present == 'true'
        working-directory: contracts
        run: forge build
      - name: forge test
        if: steps.check.outputs.present == 'true'
        working-directory: contracts
        run: forge test -vv

  docker:
    name: API container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: sera-payroll-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot the image and hit /v1/health
        run: |
          docker run -d --name api -p 4000:4000 -e DEMO_MODE=true -e SEED_ON_START=true -e SESSION_SECRET=ci-only-not-a-secret-0123456789 -e PGLITE_MEMORY=1 sera-payroll-api:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:4000/v1/health && exit 0; sleep 2; done
          docker logs api; exit 1
