# Render blueprint: API (Docker) + Postgres + the web app as a static site.
# In Render: New > Blueprint > point it at this repository, then fill in the
# secrets it asks for. See docs/DEPLOY.md.
databases:
  - name: sera-payroll-db
    plan: free
    databaseName: sera_payroll
    user: sera_payroll

services:
  - type: web
    name: sera-payroll-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sera-payroll-db
          property: connectionString
      - key: PORT
        value: 4000
      - key: DEMO_MODE
        value: "true"
      - key: SEED_ON_START
        value: "true"
      - key: CHAIN
        value: sepolia
      - key: SWAP_PROVIDER
        value: sample
      - key: COOKIE_SAME_SITE
        value: none
      - key: WEB_ORIGIN
        fromService:
          type: web
          name: sera-payroll-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: BRAND
        value: "[YOUR PAYROLL BRAND]"
      - key: SESSION_SECRET
        generateValue: true
      - key: RPC_URL
        sync: false
      - key: PAYROLL_DISBURSER_ADDRESS
        sync: false
      - key: PAYSLIP_REGISTRY_ADDRESS
        sync: false
      - key: OPERATOR_SIGNER_PRIVATE_KEY
        sync: false

  - type: web
    name: sera-payroll-web
    runtime: static
    buildCommand: corepack enable && corepack prepare pnpm@10.4.1 --activate && pnpm install --frozen-lockfile && pnpm --filter @sera-payroll/core build && cd apps/web && pnpm build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /404.html
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: sera-payroll-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_SITE_URL
        sync: false
      - key: VITE_CHAIN_ID
        value: "11155111"
